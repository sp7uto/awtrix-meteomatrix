name: Installer safety tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  installer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile installer
        run: python -m py_compile tools/meteomatrix.py tests/test_installer.py
      - name: Test safeguards and bitmap preservation
        run: python -m unittest discover -s tests -v
