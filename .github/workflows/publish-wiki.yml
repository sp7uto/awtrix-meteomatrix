name: Publish MeteoMatrix Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: write

concurrency:
  group: meteomatrix-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned wiki source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate source pages
        shell: bash
        run: |
          set -euo pipefail
          test -s wiki/Home.md
          test -s wiki/_Sidebar.md
          test "$(find wiki -maxdepth 1 -name '*.md' -type f | wc -l)" -ge 16
          for f in wiki/*.md; do
            test -s "$f"
          done
          echo "Wiki source validation passed"

      - name: Synchronize managed pages to GitHub Wiki
        shell: bash
        env:
          WIKI_PAT: ${{ secrets.WIKI_TOKEN }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prefer the optional repository secret WIKI_TOKEN. Try the
          # repository-scoped GITHUB_TOKEN if no dedicated token exists.
          token="$REPOSITORY_TOKEN"
          if [ -n "$WIKI_PAT" ]; then
            token="$WIKI_PAT"
          fi
          echo "::add-mask::$token"
          url="https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          # Never create an unrelated repository or overwrite the Wiki history.
          if ! git ls-remote "$url" HEAD > /dev/null 2>&1; then
            echo "::error::GitHub Wiki is not initialized or authentication lacks access. Create the first Home page in the Wiki web UI; if needed, add a WIKI_TOKEN secret with repository wiki write access."
            exit 1
          fi

          git clone --quiet "$url" "$RUNNER_TEMP/wiki-live"
          cd "$RUNNER_TEMP/wiki-live"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          marker='<!-- managed-by: meteomatrix-wiki-sync -->'
          for src in "$GITHUB_WORKSPACE"/wiki/*.md; do
            name="$(basename "$src")"
            dest="./$name"

            # Respect a manually maintained Wiki Home and sidebar. Likewise,
            # refuse to replace any other page not marked as managed.
            if [ -f "$dest" ] && ! grep -Fqx "$marker" "$dest"; then
              if [ "$name" = "Home.md" ] || [ "$name" = "_Sidebar.md" ]; then
                echo "Preserved manually maintained $name"
                continue
              fi
              echo "::error file=$name::Refusing to overwrite an existing unmanaged Wiki page."
              exit 1
            fi

            { printf '%s\n\n' "$marker"; cat "$src"; } > "$dest"
          done

          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
            exit 0
          fi
          git commit -m "docs: sync MeteoMatrix bilingual Wiki from main"
          git push origin HEAD
          echo "MeteoMatrix Wiki synchronization complete"
